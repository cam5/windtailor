<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; }
  #card {
    margin: 13px;
    padding: 15px;
    background-color: #3a81f5;
    border-radius: 9px;
    color: #f0f2f5;
  }
  #card .title {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  #card .body {
    font-size: 15px;
    color: #eef1f6;
  }
  #card .cta {
    display: inline-block;
    margin-top: 14px;
    padding: 9px 17px;
    background-color: #111827;
    color: #ffffff;
    border-radius: 33px;
  }
</style>
</head>
<body>
  <div id="card">
    <div class="title">Astonishing</div>
    <div class="body">A small fixture card with deliberately off-scale spacing and colors.</div>
    <div class="cta">Click me</div>
  </div>
</body>
</html>
